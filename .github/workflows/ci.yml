name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Build Docker image
        run: docker build -t devops-demo-api:${{ github.sha }} ./api

      - name: Smoke test the container
        run: |
          docker run -d --name api -p 3000:3000 devops-demo-api:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:3000/health

      - name: Show container logs if something failed
        if: failure()
        run: docker logs api || true

  publish:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/devops-demo-api
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest ./api
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest